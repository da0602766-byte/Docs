name: Publicar Ciclo Certo no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ciclo-certo/frontend/**'
      - '.github/workflows/publicar-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obter o projeto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preparar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ciclo-certo/frontend/package-lock.json
      - name: Instalar dependências
        working-directory: ciclo-certo/frontend
        run: npm ci
      - name: Compilar frontend para /Docs/
        working-directory: ciclo-certo/frontend
        env:
          # Endereço público da API futura, nunca senhas ou chaves secretas.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build:pages
      - name: Preparar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Enviar somente o site compilado
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ciclo-certo/frontend/dist

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Publicar o site
        id: publicacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
